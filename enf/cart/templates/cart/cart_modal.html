{% if cart_items %}
    <div class="cart" data-cart-total="{{ cart.total_items }}">
        <ul class="cart__items">
            {% for item in cart_items %}
                {% include "cart/cart_item.html" %}
            {% endfor %}
        </ul>
        {% include "cart/cart_summary.html" %}
    </div>
{% else %}
    {% include "cart/cart_empty.html" %}
{% endif %}
