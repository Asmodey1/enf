{% load i18n %}
<div class="cart cart--empty" data-cart-total="0">
    <div class="empty">
        <p class="empty__title">{% translate "Your cart is empty" %}</p>
        <p class="empty__text">{% translate "Add something you like — it will appear here." %}</p>
        <a class="btn btn--secondary" href="{% url 'main:catalog_all' %}"
           hx-get="{% url 'main:catalog_all' %}" hx-target="#main-content" hx-push-url="true">{% translate "Continue shopping" %}</a>
    </div>
</div>
