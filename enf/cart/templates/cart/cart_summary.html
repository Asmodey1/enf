{% load i18n %}
<div class="cart__footer">
    <div class="cart__row">
        <span>{% translate "Subtotal" %}</span>
        <span>${{ cart.subtotal|floatformat:"2g" }}</span>
    </div>
    <p class="cart__note">{% translate "Shipping is calculated at checkout." %}</p>
    <a class="btn btn--primary btn--block" href="{% url 'orders:checkout' %}"
       hx-get="{% url 'orders:checkout' %}" hx-target="#main-content" hx-push-url="true">{% translate "Checkout" context "button" %}</a>
    <button type="button" class="text-btn cart__clear"
            hx-post="{% url 'cart:clear_cart' %}" hx-confirm="{% translate 'Remove all items from the cart?' %}">{% translate "Clear cart" %}</button>
</div>
