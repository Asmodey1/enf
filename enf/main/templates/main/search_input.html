{% load i18n %}
<div class="search-field" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="search-input" name="q" value="{{ search_query }}" placeholder="{% translate 'Search' %}"
           autocomplete="off" aria-label="{% translate 'Search products' %}" data-clean-params
           hx-get="{% url 'main:catalog_all' %}" hx-trigger="input changed delay:400ms, search"
           hx-target="#main-content" hx-push-url="true">
    <button type="button" class="icon-btn icon-btn--sm" aria-label="{% translate 'Close search' %}" data-search-reset
            hx-get="{% url 'main:catalog_all' %}?reset_search=true" hx-target="#search-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
</div>
