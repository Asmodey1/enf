{% load i18n %}{% if current_category %}{% url 'main:catalog' current_category as catalog_url %}{% else %}{% url 'main:catalog_all' as catalog_url %}{% endif %}
<form class="filters" data-clean-params
      hx-get="{{ catalog_url }}" hx-target="#main-content" hx-push-url="true">
    <input type="hidden" name="q" value="{{ filter_params.q }}">

    <div class="filters__body">
        <fieldset class="filters__group">
            <legend class="label">{% translate "Size" %}</legend>
            <div class="chips">
                <label class="choice">
                    <input type="radio" name="size" value=""{% if not filter_params.size %} checked{% endif %}>
                    <span>{% translate "Any" %}</span>
                </label>
                {% for size in sizes %}
                    <label class="choice">
                        <input type="radio" name="size" value="{{ size.name }}"{% if filter_params.size == size.name %} checked{% endif %}>
                        <span>{{ size.name }}</span>
                    </label>
                {% endfor %}
            </div>
        </fieldset>

        <div class="field">
            <label class="field__label" for="filter-color">{% translate "Color" %}</label>
            <input type="text" id="filter-color" name="color" value="{{ filter_params.color }}" placeholder="{% translate 'e.g. Black' %}" autocomplete="off">
        </div>

        <fieldset class="filters__group">
            <legend class="label">{% translate "Price, $" %}</legend>
            <div class="filters__price">
                <div class="field">
                    <input type="number" name="min_price" value="{{ filter_params.min_price }}" min="0" step="any" placeholder="{% translate 'From' %}" aria-label="{% translate 'Minimum price' %}">
                </div>
                <span aria-hidden="true">—</span>
                <div class="field">
                    <input type="number" name="max_price" value="{{ filter_params.max_price }}" min="0" step="any" placeholder="{% translate 'To' %}" aria-label="{% translate 'Maximum price' %}">
                </div>
            </div>
        </fieldset>
    </div>

    <div class="filters__footer">
        <a class="btn btn--secondary" href="{{ catalog_url }}{% if filter_params.q %}?q={{ filter_params.q|urlencode }}{% endif %}"
           hx-get="{{ catalog_url }}{% if filter_params.q %}?q={{ filter_params.q|urlencode }}{% endif %}"
           hx-target="#main-content" hx-push-url="true">{% translate "Reset" %}</a>
        <button type="submit" class="btn btn--primary">{% translate "Show results" %}</button>
    </div>
</form>
